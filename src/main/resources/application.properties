spring.application.name=authentication-service-adv

server.port=${SERVER_PORT:8081}

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate

security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:15m}
security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:7d}

app.admin.user-id=${ADMIN_USER_ID}
app.admin.login=${ADMIN_LOGIN}
app.admin.password=${ADMIN_PASSWORD}
