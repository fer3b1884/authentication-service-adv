services:
  app:
    build: .
    container_name: auth-service-app
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DOCKER_DB_URL: ${DOCKER_DB_URL}
      DOCKER_DB_USERNAME: ${DOCKER_DB_USERNAME}
      DOCKER_DB_PASSWORD: ${DOCKER_DB_PASSWORD}
      DOCKER_JWT_SECRET: ${DOCKER_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: auth-service-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DOCKER_DB_USERNAME}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: